name: Linting

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.13"

permissions:
  contents: read

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🚀 Check code for common misspellings
        run: uv run --locked prek run codespell --all-files

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🚀 Run ruff linter
        run: uv run --locked ruff check --output-format=github .
      - name: 🚀 Run ruff formatter
        run: uv run --locked ruff format --check .

  prek-hooks:
    name: prek-hooks
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🚀 Check Python AST
        run: uv run --locked prek run check-ast --all-files
      - name: 🚀 Check for case conflicts
        run: uv run --locked prek run check-case-conflict --all-files
      - name: 🚀 Check JSON files
        run: uv run --locked prek run check-json --all-files
      - name: 🚀 Check TOML files
        run: uv run --locked prek run check-toml --all-files
      - name: 🚀 Check YAML files
        run: uv run --locked prek run check-yaml --all-files
      - name: 🚀 Check End of Files
        run: uv run --locked prek run end-of-file-fixer --all-files
      - name: 🚀 Trim Trailing Whitespace
        run: uv run --locked prek run trailing-whitespace --all-files

  pylint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🚀 Run pylint
        run: uv run --locked pylint src/tuya_device_handlers

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🚀 Run yamllint
        run: uv run --locked yamllint .

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: 🏗 Install NPM dependencies
        run: npm install
      - name: 🚀 Run prettier
        run: uv run --locked prek run prettier --all-files

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🚀 Run zizmor
        run: uv run --locked zizmor .github/workflows/
