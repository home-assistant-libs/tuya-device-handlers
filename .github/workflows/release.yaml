name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

env:
  DEFAULT_PYTHON: "3.13"

permissions:
  contents: read

jobs:
  release:
    name: Releasing to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/tuya-device-handlers
    permissions:
      attestations: write
      id-token: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: ${{ env.DEFAULT_PYTHON }}
          # No cache on release builds, to avoid cache poisoning
          enable-cache: false
      - name: 🏗 Set package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          uv version "${version}" --frozen
      - name: 🏗 Build package
        run: uv build
      - name: 🧭 Locate built wheel
        run: |
          WHEEL_PATH=$(ls dist/tuya_device_handlers-*-py3-none-any.whl)
          echo "WHEEL_PATH=${WHEEL_PATH}" >> "${GITHUB_ENV}"
      - name: 📝 Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ env.WHEEL_PATH }}
          format: cyclonedx-json
          output-file: tuya-device-handlers.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: 📝 Attest SBOM against built artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
          sbom-path: tuya-device-handlers.cdx.json
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          print-hash: true
