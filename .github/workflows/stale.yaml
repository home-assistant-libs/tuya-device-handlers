name: Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: 🧹 Mark stale issues and PRs
    if: github.repository_owner == 'home-assistant-libs'
    runs-on: ubuntu-latest
    permissions:
      issues: write # To label, comment on and close stale issues
      pull-requests: write # To label, comment on and close stale PRs
      actions: write # To delete stalebot state
    steps:
      - name: 🚀 Run stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          remove-stale-when-updated: true
          operations-per-run: 150
          # issue policy
          days-before-issue-stale: 30
          days-before-issue-close: 15
          stale-issue-label: "stale"
          exempt-issue-labels: "no-stale"
          stale-issue-message: >
            There hasn't been any activity on this issue recently, so it has
            been marked as stale and will be closed if no further activity
            occurs within 15 days.

            If this is about your device, note that device quirks are not
            written on request: as the owner of the device, you are the one
            best placed to fix it. Write a quirk for
            your device, test it live from your `<config>/tuya_quirks/`
            folder, and then open a pull request so everyone with the same
            device benefits. See
            [Writing a quirk](https://github.com/home-assistant-libs/tuya-device-handlers#writing-a-quirk)
            and the [recipes](https://github.com/home-assistant-libs/tuya-device-handlers/tree/main/docs)
            for step-by-step guides.

            If you're working on it, or the issue is still relevant, leave a
            comment to keep it open. Thank you!
          # pr policy
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale"
          stale-pr-message: >
            There hasn't been any activity on this pull request recently, so it
            has been marked as stale and will be closed if no further activity
            occurs within 7 days.

            If you are the author and still want to get it merged, please
            address any open review comments, update the branch with the
            latest `main`, and mark the pull request as ready for review.
            Thank you for your contribution!
